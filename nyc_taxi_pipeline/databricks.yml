# This is a Declarative Automation Bundle definition for nyc_taxi_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyc_taxi_pipeline
  uuid: a1b8af2e-586d-4273-b1bd-a4800d6afb91

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  raw_path:
    description: The raw landing path
  raw_to_bronze_checkpoint:
    description: The checkpoint to use for Delta Streaming raw to bronze
  bronze_to_silver_checkpoint:
    description:  The checkpoint to use for Delta Streaming bronze to silver
  silver_quarantine_checkpoint:
    description:  The checkpoint to use for Delta Streaming bronze to quarantine
  raw_schema:
    description: The schema for AutoLoader in bronze ingestion
  

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405607790621480.0.azuredatabricks.net
    variables:
      catalog: nyc_taxi_dev
      raw_path: /Volumes/nyc_taxi_dev/bronze/raw_landing
      raw_schema: /Volumes/nyc_taxi_dev/bronze/raw_schema
      raw_to_bronze_checkpoint: /Volumes/nyc_taxi_dev/bronze/raw_to_bronze
      bronze_to_silver_checkpoint: /Volumes/nyc_taxi_dev/silver/bronze_to_silver
      silver_quarantine_checkpoint: /Volumes/nyc_taxi_dev/silver/silver_quarantine
  prod:
    mode: production
    workspace:
      host: https://adb-7405607790621480.0.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/adampassachin@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/adampassachin@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: nyc_taxi
      raw_path: /Volumes/nyc_taxi/bronze/raw_landing
    permissions:
      - user_name: adampassachin@hotmail.com
        level: CAN_MANAGE
